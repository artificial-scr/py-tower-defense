[project]
name = "py-tower-defense"
version = "0.1.0"
description = "A pygame-ce tower defense game where towers evolve by fusing, across 10 themed levels with boss fights"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long simulations (full playthrough, 10x stress run); skip with -m 'not slow'"]
